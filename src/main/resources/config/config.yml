framework:
  name: Mobilytix

  execution_mode: "local" # local | sauce_labs — override with EXECUTION_MODE env

  sauce_labs:
    region: "eu-central-1"
    build: "mobilytix"
    device_name: "Android GoogleAPI Emulator"
    platform_version: "12"
    app_storage_filename: "MyDemoAppAndroid.apk"

  appium:
    # Set auto_start to true when running in CI or if you want the framework to start and stop the Appium server automatically.
    # Set to false if you prefer to start Appium manually before running tests.
    # Both modes will never collide — the framework checks if the server is already running before attempting to start it.
    auto_start: true
    host: "127.0.0.1"
    port: 4723
    log_level: "info"

  # Path to the folder containing all APKs, relative to the project root.
  # All app apk_path values below are relative to this base path.
  apk_base_path: "apks"

  # Default wait timeouts in seconds.
  timeouts:
    implicit: 0 # Keep at 0 — framework uses explicit waits only
    explicit: 15 # How long to wait for an element before failing
    page_load: 30 # How long to wait for a page/screen to load

device:
  # Default device used for sequential runs
  # Run `adb devices` in your terminal to find your device udid.
  # For an emulator it will look like: emulator-5554
  # For a physical device it will be a serial number e.g. R58M123ABCD
  udid: "emulator-5554"
  platform_name: "Android"
  platform_version: "14"
  automation_name: "UiAutomator2"
  new_command_timeout: 300
  no_reset: false
  full_reset: false

# Additional devices for parallel runs
# Thread 1 uses devices[0], Thread 2 uses devices[1] etc.
#parallel_devices:
#  - udid: "emulator-5554"
#  - udid: "emulator-5556"

# Add a new block here for every app you want to test.
# The key (e.g. app_a) is what you pass to @AppUnderTest("app_a").
apps:
  sauce_demo:
    app_name: "Sauce Labs Demo App"
    apk_path: "sauce_demo/MyDemoAppAndroid.apk"
    package_name: "com.saucelabs.mydemoapp.android"
    activity: "com.saucelabs.mydemoapp.android.view.activities.SplashActivity"
    requires_auth: false
    auth_type: "basic"
    otp_source: ""
    # Controls how CI downloads and caches the APK for this app.
    # Local runs use apk_path above — these fields are CI/download only.
    apk_source:
      base_url: "https://github.com/saucelabs/my-demo-app-android/releases/download"
      version: "2.2.0"
      build: "25"
      filename: "mda-{version}-{build}.apk"
      download_url: ""

reporting:
  extent:
    output_path: "target/extent-reports/mobilytix-report.html"
    theme: "DARK"   # DARK | STANDARD
  screenshots:
    on_failure: true
    on_pass: false
  screen_recording:
    enabled: false
    output_path: "target/screen-recordings"