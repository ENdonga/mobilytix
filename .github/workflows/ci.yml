name: Mobilytix CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests on Android Emulator
    runs-on: ubuntu-latest

    steps:
      # Setup
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Enable KVM for emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js for Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm global packages
        id: cache-npm-global
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: ${{ runner.os }}-npm-global-appium-v1

      - name: Cache Appium drivers
        id: cache-appium
        uses: actions/cache@v4
        with:
          path: ~/.appium
          key: ${{ runner.os }}-appium-uiautomator2-v1

      - name: Set npm global prefix
        run: npm config set prefix ~/.npm-global

      - name: Install Appium and UiAutomator2 driver
        if: steps.cache-npm-global.outputs.cache-hit != 'true'
        run: |
          npm install -g appium@latest
          npm install -g @appium/doctor
          appium driver install uiautomator2

      - name: Add npm global to PATH
        run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Verify Appium installation
        run: |
          appium -v
          appium-doctor --android
          appium driver list --installed
        continue-on-error: true

      # APK — read config, cache, download only on cache miss
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yq-v1

      - name: Install yq
        run: pip install yq --quiet

      - name: Read APK config from config.yaml
        id: apk-config
        run: |
          DOWNLOAD_URL=$(yq -r '.apps.sauce_demo.apk_source.download_url // ""' \
            src/main/resources/config/config.yml)
          VERSION=$(yq -r '.apps.sauce_demo.apk_source.version' \
            src/main/resources/config/config.yml)
          BUILD=$(yq -r '.apps.sauce_demo.apk_source.build' \
            src/main/resources/config/config.yml)
          BASE_URL=$(yq -r '.apps.sauce_demo.apk_source.base_url' \
            src/main/resources/config/config.yml)
          FILENAME=$(yq -r '.apps.sauce_demo.apk_source.filename' \
            src/main/resources/config/config.yml)

          # If download_url is blank — construct from parts
          # mirrors exactly what ApkSource.resolveDownloadUrl() does in Java
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            RESOLVED_FILENAME=$(echo "$FILENAME" \
              | sed "s/{version}/$VERSION/g" \
              | sed "s/{build}/$BUILD/g")
            DOWNLOAD_URL="$BASE_URL/$VERSION/$RESOLVED_FILENAME"
            echo "download_url blank — constructed from parts: $DOWNLOAD_URL"
          else
            echo "Using download_url from config: $DOWNLOAD_URL"
          fi

          CACHE_KEY="$VERSION-$BUILD"
          echo "apk_url=$DOWNLOAD_URL"    >> $GITHUB_OUTPUT
          echo "apk_version=$CACHE_KEY"   >> $GITHUB_OUTPUT
          echo "APK URL:   $DOWNLOAD_URL"
          echo "Cache key: $CACHE_KEY"

      - name: Cache APK
        id: cache-apk
        uses: actions/cache@v4
        with:
          path: apks/sauce_demo/MyDemoAppAndroid.apk
          key: apk-sauce-demo-${{ steps.apk-config.outputs.apk_version }}-${{ runner.os }}

      - name: Download APK
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: |
          mkdir -p apks/sauce_demo
          echo "Cache miss — downloading APK"
          echo "URL: ${{ steps.apk-config.outputs.apk_url }}"
          curl -L "${{ steps.apk-config.outputs.apk_url }}" \
               -o apks/sauce_demo/MyDemoAppAndroid.apk
          file apks/sauce_demo/MyDemoAppAndroid.apk
          ls -lh apks/sauce_demo/
          file apks/sauce_demo/MyDemoAppAndroid.apk | grep -qiE "zip|jar|android" || \
            { echo "ERROR: Downloaded file is not a valid APK"; exit 1; }
          echo "✅ APK downloaded and valid"

      # Tests
      - name: Run tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXECUTION_MODE: "local"
          APPIUM_AUTO_START: "true"
          DEVICE_UDID: "emulator-5554"
          APPIUM_LOG_LEVEL: "warn"
          EXPLICIT_TIMEOUT: "45"
          PAGE_LOAD_TIMEOUT: "60"
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          SAUCE_LOCKED_USERNAME: ${{ secrets.SAUCE_LOCKED_USERNAME }}
          SAUCE_LABS_USERNAME: ${{ secrets.SAUCE_LABS_USERNAME }}
          SAUCE_LABS_ACCESS_KEY: ${{ secrets.SAUCE_LABS_ACCESS_KEY }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          avd-name: mobilytix_emulator
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: ./mvnw clean test -Dtestng.suite=testng.xml

      # Reports — always upload even if tests failed
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 1

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-reports/
          retention-days: 30

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/logs/
          retention-days: 30

  # Report generation — runs after test job completes
  report:
    name: Generate Allure report
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.result == 'success' || needs.test.result == 'failure'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      - name: Generate Allure report
        run: ./mvnw allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin/

      # -----------------------------------------------------------------------
