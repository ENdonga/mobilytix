name: CI Smoke Test

on:
  push:
    branches: [ fix_resolve_flaky_tests ]
jobs:
  smoke:
    name: Smoke — APK download verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js for Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set npm global prefix and PATH
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Cache npm global packages
        id: cache-npm-global
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: ${{ runner.os }}-npm-global-appium-v1

      - name: Cache Appium drivers
        id: cache-appium
        uses: actions/cache@v4
        with:
          path: ~/.appium
          key: ${{ runner.os }}-appium-uiautomator2-v1

      - name: Install Appium and UiAutomator2 driver
        if: steps.cache-npm-global.outputs.cache-hit != 'true'
        run: |
          npm install -g appium@latest
          npm install -g @appium/doctor
          appium driver install uiautomator2

      # -----------------------------------------------------------------------
      # APK download — test both scenarios
      # -----------------------------------------------------------------------
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yq-v1

      - name: Install yq
        run: pip install yq --quiet

      - name: Resolve APK URL
        id: apk
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'full_url' }}"

          VERSION=$(yq -r '.apps.sauce_demo.apk_source.version' \
            src/main/resources/config/config.yml)
          BUILD=$(yq -r '.apps.sauce_demo.apk_source.build' \
            src/main/resources/config/config.yml)
          BASE_URL=$(yq -r '.apps.sauce_demo.apk_source.base_url' \
            src/main/resources/config/config.yml)
          FILENAME=$(yq -r '.apps.sauce_demo.apk_source.filename' \
            src/main/resources/config/config.yml)

          if [ "$SCENARIO" = "full_url" ]; then
            DOWNLOAD_URL=$(yq -r '.apps.sauce_demo.apk_source.download_url // ""' \
              src/main/resources/config/config.yml)
            echo "Scenario: full_url → $DOWNLOAD_URL"
          else
            DOWNLOAD_URL=""
            echo "Scenario: constructed_url → blanking download_url"
          fi

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            RESOLVED=$(echo "$FILENAME" \
              | sed "s/{version}/$VERSION/g" \
              | sed "s/{build}/$BUILD/g")
            DOWNLOAD_URL="$BASE_URL/$VERSION/$RESOLVED"
            echo "Constructed URL: $DOWNLOAD_URL"
          fi

          CACHE_KEY="$VERSION-$BUILD"
          echo "apk_url=$DOWNLOAD_URL"    >> $GITHUB_OUTPUT
          echo "apk_version=$CACHE_KEY"   >> $GITHUB_OUTPUT  # ← add this
          echo "Final URL: $DOWNLOAD_URL"
          echo "Cache key: $CACHE_KEY"

      - name: Cache APK
        id: cache-apk
        uses: actions/cache@v4
        with:
          path: apks/sauce_demo/MyDemoAppAndroid.apk
          key: apk-sauce-demo-${{ steps.apk.outputs.apk_version }}-${{ runner.os }}

      - name: Download APK
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: |
          mkdir -p apks/sauce_demo
          curl -L "${{ steps.apk.outputs.apk_url }}" \
               -o apks/sauce_demo/MyDemoAppAndroid.apk
          file apks/sauce_demo/MyDemoAppAndroid.apk
          ls -lh apks/sauce_demo/
          file apks/sauce_demo/MyDemoAppAndroid.apk | grep -qiE "zip|jar|android" || \
            { echo "ERROR: Not a valid APK"; exit 1; }
          echo "✅ APK downloaded and valid"

      # -----------------------------------------------------------------------
      # One smoke test — fastest possible verification the APK works
      # No reporting — just pass or fail
      # -----------------------------------------------------------------------
      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXECUTION_MODE: "local"
          APPIUM_AUTO_START: "true"
          DEVICE_UDID: "emulator-5554"
          APPIUM_LOG_LEVEL: "warn"
          EXPLICIT_TIMEOUT: "45"
          PAGE_LOAD_TIMEOUT: "60"
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          SAUCE_LOCKED_USERNAME: ${{ secrets.SAUCE_LOCKED_USERNAME }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          avd-name: mobilytix_emulator
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: ./mvnw test -Dtest=LoginTest#testValidLogin
